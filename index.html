<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanewatch</title>
<meta name="description" content="Freight-fraud checker for brokers that learns from every confirmed call.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23006b3f'/><rect x='3' y='3' width='26' height='26' rx='4' fill='none' stroke='white' stroke-width='2'/><path d='M16 8v16' stroke='white' stroke-width='3' stroke-dasharray='4 3'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Road palette: asphalt navy, concrete grey, sign green, DOT orange, reflective white, lane yellow */
  :root {
    --asphalt: #1b2430;
    --asphalt-2: #2a3542;
    --concrete: #d9dcde;
    --concrete-dark: #8b939a;
    --sign-green: #006b3f;
    --dot-orange: #f47b20;
    --reflective: #ffffff;
    --lane-yellow: #f5c518;

    --bg: #e9ebec;
    --surface: #ffffff;
    --surface-2: #f2f3f4;
    --text: #1b2430;
    --muted: #55606b;
    --border: #cfd3d6;
    --focus: #1d4ed8;
    --orange-ink: #a34709;
    --green-ink: #006b3f;
    --post: #8b939a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121922;
      --surface: #1b2430;
      --surface-2: #232e3b;
      --text: #f3f5f6;
      --muted: #a3adb6;
      --border: #313d4b;
      --focus: #ffd34d;
      --orange-ink: #ff9a4d;
      --green-ink: #4fd18f;
      --post: #4a5562;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 16px/1.5 "Barlow", ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; border-radius: 4px; }
  .cond { font-family: "Barlow Condensed", "Arial Narrow", sans-serif; }

  header {
    max-width: 1200px; margin: 0 auto; padding: 28px 20px 12px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin: 0; font: 700 30px/1 "Barlow Condensed", sans-serif; letter-spacing: .01em; }
  .mark { width: 30px; height: 30px; border-radius: 5px; background: var(--sign-green); position: relative; flex: none; }
  .mark::before { content: ""; position: absolute; inset: 3px; border: 2px solid var(--reflective); border-radius: 3px; }
  .mark::after { content: ""; position: absolute; left: 13px; top: 7px; bottom: 7px; width: 3px;
    background: repeating-linear-gradient(var(--reflective) 0 4px, transparent 4px 7px); }
  .tag { color: var(--muted); margin: 0; }

  main {
    max-width: 1200px; margin: 0 auto; padding: 12px 20px 56px;
    display: grid; gap: 28px; align-items: start;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  }
  @media (max-width: 880px) { main { grid-template-columns: minmax(0, 1fr); gap: 24px; } }
  @media (max-width: 520px) { header, main { padding-left: 16px; padding-right: 16px; } }

  h2 { font-size: 18px; font-weight: 600; margin: 0 0 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); min-width: 0; }
  .call-card { border-radius: 6px; padding: 24px; position: sticky; top: 20px; }
  @media (max-width: 880px) { .call-card { position: static; } }
  .sign { scroll-margin-top: 16px; }
  .side { display: grid; gap: 20px; min-width: 0; }
  .plain { border-radius: 12px; padding: 20px; }

  .presets-label { font-size: 14px; color: var(--muted); margin: 0 0 8px; }
  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
  .presets button { flex: 1 1 140px; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 520px) { .grid { grid-template-columns: minmax(0, 1fr); } }
  .full { grid-column: 1 / -1; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 5px; }
  label small { font-weight: 400; color: var(--muted); }
  input, select, textarea {
    width: 100%; font: inherit; color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 4px; padding: 10px 12px;
  }
  textarea { min-height: 140px; resize: vertical; }
  input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: 0; }

  button {
    font: 600 15px/1.2 "Barlow", sans-serif; cursor: pointer; border-radius: 4px; padding: 11px 14px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  }
  button:hover { border-color: var(--concrete-dark); }
  button.fraud { background: var(--dot-orange); color: #111; border-color: var(--dot-orange); }
  button.legit { background: var(--sign-green); color: var(--reflective); border-color: var(--sign-green); }
  button.fraud:hover, button.legit:hover { filter: brightness(1.07); }
  button.link { background: none; border: none; padding: 4px 2px; color: var(--muted); text-decoration: underline; font-weight: 500; }

  /* ---- Signature moment: the road sign ---- */
  .signpost { perspective: 1000px; }
  .sign {
    --sb: var(--concrete); --si: var(--asphalt);
    background: var(--sb); color: var(--si);
    border-radius: 14px; padding: 9px; position: relative; z-index: 1;
    box-shadow: 0 14px 28px -12px rgba(10, 16, 24, .45);
    transform-origin: 50% 0;
  }
  .sign.safe { --sb: var(--sign-green); --si: var(--reflective); }
  .sign.hold { --sb: var(--dot-orange); --si: #111111; }
  .sign-inner {
    border: 4px solid var(--si); border-radius: 8px; padding: 18px 16px 20px; text-align: center;
  }
  .pct { font: 700 clamp(84px, 13vw, 128px)/.9 "Barlow Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; }
  .call { font: 700 clamp(28px, 4vw, 38px)/1.05 "Barlow Condensed", "Arial Narrow", sans-serif; margin-top: 6px; }
  .sub { font-size: 14px; margin-top: 8px; opacity: .85; }
  .posts { display: flex; justify-content: space-between; padding: 0 24%; margin-top: -4px; }
  .posts i { width: 12px; height: 46px; background: var(--post); border-radius: 0 0 2px 2px; }
  .sign.flip { animation: flip .7s cubic-bezier(.2, .9, .25, 1.15); }
  @keyframes flip {
    0% { transform: rotateX(-88deg); }
    100% { transform: rotateX(0); }
  }

  .reasons { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
  .reasons li {
    display: flex; justify-content: space-between; gap: 12px; align-items: baseline;
    padding: 9px 12px; background: var(--surface-2); border-left: 4px solid var(--concrete-dark); border-radius: 0 4px 4px 0;
  }
  .reasons li.net { border-left-color: var(--dot-orange); }
  .reasons .w { font: 700 20px/1 "Barlow Condensed", sans-serif; color: var(--orange-ink); font-variant-numeric: tabular-nums; }
  .none { color: var(--muted); font-size: 15px; }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .actions button { flex: 1 1 150px; padding: 13px 14px; font-size: 16px; }

  /* ---- Lane-marking weight bars ---- */
  .weights { display: grid; gap: 9px; }
  .wrow { display: grid; grid-template-columns: 9.5em minmax(0, 1fr) 2.8em 3.4em; gap: 10px; align-items: center; font-size: 14px; }
  @media (max-width: 420px) { .wrow { grid-template-columns: 7.6em minmax(0, 1fr) 2.6em 3.2em; gap: 6px; font-size: 13px; } }
  .track { height: 16px; background: var(--asphalt); border-radius: 3px; position: relative; overflow: hidden; }
  @media (prefers-color-scheme: dark) { .track { background: #0b1016; box-shadow: inset 0 0 0 1px #3a4655; } }
  .track .fill {
    position: absolute; left: 6px; top: 6px; height: 4px; width: 0; max-width: calc(100% - 12px);
    background: repeating-linear-gradient(90deg, var(--reflective) 0 14px, transparent 14px 22px);
    transition: width .9s cubic-bezier(.2, .8, .2, 1);
  }
  .num { text-align: right; font: 600 18px/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; }
  .delta { font: 700 15px/1 "Barlow Condensed", sans-serif; padding: 3px 5px; border-radius: 3px; text-align: center; opacity: 0; }
  .wrow.changed .fill { animation: laneflash 2.6s steps(1, end); }
  @keyframes laneflash { 0%, 80% { background: var(--lane-yellow); } }
  .wrow.changed .delta { animation: pop 2.6s ease-out forwards; }
  .delta.up { background: var(--lane-yellow); color: #111; }
  .delta.down { background: var(--sign-green); color: var(--reflective); }
  @keyframes pop { 0% { opacity: 0; transform: translateY(4px); } 12%, 75% { opacity: 1; transform: none; } 100% { opacity: 0; } }
  .bias { margin: 12px 0 0; font-size: 14px; color: var(--muted); }

  .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 18px; }
  .stat { border-top: 4px solid var(--asphalt); padding-top: 8px; }
  @media (prefers-color-scheme: dark) { .stat { border-top-color: var(--concrete-dark); } }
  .stat b { display: block; font: 700 38px/1 "Barlow Condensed", sans-serif; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 13px; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .row h2 { margin: 0 0 14px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; min-height: 8px; margin-bottom: 20px; }
  .chip {
    display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600;
    padding: 4px 10px 4px 8px; border-radius: 3px 12px 12px 3px;
    background: var(--surface-2); border: 1.5px solid var(--dot-orange); color: var(--text); overflow-wrap: anywhere;
  }
  .chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--dot-orange); flex: none; }
  .chip.new { animation: slide .5s cubic-bezier(.2, .8, .2, 1) both; }
  .chip.new:nth-child(2) { animation-delay: .08s; } .chip.new:nth-child(3) { animation-delay: .16s; }
  @keyframes slide { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
  .empty-chips { font-size: 14px; color: var(--muted); }

  .log { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; max-height: 320px; overflow: auto; }
  .log li { font-size: 14px; padding: 10px 12px; background: var(--surface-2); border-left: 4px solid var(--concrete-dark); border-radius: 0 4px 4px 0; }
  .log li.f { border-left-color: var(--dot-orange); }
  .log li.l { border-left-color: var(--sign-green); }
  .log time { display: block; color: var(--muted); font-size: 12px; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--asphalt); color: var(--reflective); padding: 11px 16px; border-radius: 6px; font-size: 15px;
    border-left: 4px solid var(--lane-yellow);
    transition: opacity .2s, transform .2s; pointer-events: none; max-width: calc(100% - 32px); z-index: 5;
  }
  @media (prefers-color-scheme: dark) { .toast { background: var(--reflective); color: var(--asphalt); } }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition: none !important; }
    .wrow.changed .delta { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<header>
  <h1 class="brand"><span class="mark" aria-hidden="true"></span>Lanewatch</h1>
  <p class="tag">Freight-fraud checker that learns from every confirmed call.</p>
</header>

<main>
  <section class="card call-card" aria-labelledby="h-call">
    <h2 id="h-call">Carrier call</h2>
    <p class="presets-label" id="presets-label">Try a demo call</p>
    <div class="presets" role="group" aria-labelledby="presets-label">
      <button type="button" data-preset="legit">1 · Legit carrier</button>
      <button type="button" data-preset="scam">2 · Subtle scam</button>
      <button type="button" data-preset="repeat">3 · Repeat scammer</button>
    </div>
    <form id="form" class="grid" autocomplete="off" novalidate>
      <div>
        <label for="mc">MC number</label>
        <input id="mc" name="mc" inputmode="numeric" placeholder="784512">
      </div>
      <div>
        <label for="age">Authority age <small>(days)</small></label>
        <input id="age" name="age" type="number" min="0" placeholder="2190">
      </div>
      <div>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="dispatch@carrier.com">
      </div>
      <div>
        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" placeholder="(614) 555-0142">
      </div>
      <div>
        <label for="ptype">Phone type</label>
        <select id="ptype" name="ptype">
          <option value="landline">Landline</option>
          <option value="mobile">Mobile</option>
          <option value="voip">VoIP</option>
        </select>
      </div>
      <div>
        <label for="bid">Bid vs market <small>(%, −18 is 18% below)</small></label>
        <input id="bid" name="bid" type="number" step="1" placeholder="0">
      </div>
      <div class="full">
        <label for="transcript">Call transcript</label>
        <textarea id="transcript" name="transcript" placeholder="Paste or type what the carrier said"></textarea>
      </div>
    </form>
  </section>

  <div class="side">
    <section class="signpost" aria-label="Verdict">
      <div id="verdict" class="sign" role="status" aria-live="polite">
        <div class="sign-inner">
          <div class="pct" id="pct">–</div>
          <div class="call" id="call">Enter a call</div>
          <div class="sub" id="sub">Pick a demo call or fill in the form</div>
        </div>
      </div>
      <div class="posts" aria-hidden="true"><i></i><i></i></div>
    </section>

    <section class="card plain" aria-labelledby="h-why">
      <h2 id="h-why">Why</h2>
      <ul class="reasons" id="reasons" aria-label="Reasons ranked by weight"></ul>
      <div class="actions">
        <button type="button" class="fraud" id="btn-fraud">Confirm fraud</button>
        <button type="button" class="legit" id="btn-legit">Confirm legit</button>
      </div>
    </section>

    <section class="card plain" aria-labelledby="h-mem">
      <div class="row">
        <h2 id="h-mem">Network memory</h2>
        <button type="button" class="link" id="btn-reset">Reset</button>
      </div>
      <div class="stats">
        <div class="stat"><b id="s-learned">0</b><span>calls learned</span></div>
        <div class="stat"><b id="s-flagged">0</b><span>flagged IDs</span></div>
        <div class="stat"><b id="s-acc">–</b><span>accuracy, last 20</span></div>
      </div>
      <div class="chips" id="chips" aria-label="Flagged identifiers" aria-live="polite"></div>
      <h2 id="h-weights">What the model trusts</h2>
      <div class="weights" id="weights" aria-labelledby="h-weights"></div>
      <p class="bias" id="bias"></p>
    </section>

    <section class="card plain" aria-labelledby="h-log">
      <h2 id="h-log">What it learned</h2>
      <ul class="log" id="log"></ul>
    </section>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  // ---------- Model ----------
  const SIGNALS = [
    { key: 'newMC',   label: 'New MC authority (<90 days)', short: 'New MC' },
    { key: 'freeMail',label: 'Free email domain',           short: 'Free email' },
    { key: 'voip',    label: 'VoIP phone',                  short: 'VoIP phone' },
    { key: 'lowBid',  label: 'Bid 15%+ below market',       short: 'Low bid' },
    { key: 'payment', label: 'Payment or factoring change request', short: 'Payment change' },
    { key: 'urgency', label: 'Urgency language',            short: 'Urgency' },
    { key: 'offPlat', label: 'Moves call to text or WhatsApp', short: 'Text / WhatsApp' },
    { key: 'network', label: 'Identifier flagged by network', short: 'Network flag' },
  ];
  const DEFAULT_W = { newMC: 1.2, freeMail: 0.8, voip: 0.8, lowBid: 1.4, payment: 1.6, urgency: 0.9, offPlat: 0.86, network: 2.6 };
  const DEFAULT_B = -2.95;
  const LR = 0.5;
  const THRESHOLD = 0.5;
  const STORE_KEY = 'lanewatch.v1';

  const FREE_DOMAINS = new Set(['gmail.com','yahoo.com','hotmail.com','outlook.com','aol.com','icloud.com','live.com','msn.com','protonmail.com','proton.me','gmx.com','mail.com','yandex.com','zoho.com','ymail.com']);
  const RX = {
    payment: /\b(factor(ing)?|quick ?pay|remit(tance)?|wire|bank (info|details|account)|new (bank|account)|payment (info|details|method|address)|change (the |my |our )?(payment|bank|remit))/i,
    urgency: /\b(urgent|asap|right now|immediately|hurry|today only|last minute|need (it|this|an answer) now|before someone else)\b/i,
    offPlat: /\b(whats ?app|telegram|text me|texting|over text|via text|move (this|it) (over )?to (text|sms)|sms)\b/i,
  };

  const sigmoid = z => 1 / (1 + Math.exp(-z));
  const digits = s => (s || '').replace(/\D/g, '').replace(/^1(?=\d{10}$)/, '');
  const normEmail = s => (s || '').trim().toLowerCase();
  const normMC = s => (s || '').replace(/\D/g, '').replace(/^0+/, '');
  const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- State ----------
  const fresh = () => ({
    w: { ...DEFAULT_W }, b: DEFAULT_B,
    block: { phones: [], emails: [], mcs: [] },
    history: [], learned: 0, log: []
  });
  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return fresh();
      const s = JSON.parse(raw);
      const f = fresh();
      return {
        w: { ...f.w, ...(s.w || {}) },
        b: typeof s.b === 'number' ? s.b : f.b,
        block: { ...f.block, ...(s.block || {}) },
        history: Array.isArray(s.history) ? s.history : [],
        learned: s.learned | 0,
        log: Array.isArray(s.log) ? s.log : []
      };
    } catch (e) { return fresh(); }
  }
  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage blocked: keep in memory */ }
  }

  // ---------- Features ----------
  const $ = id => document.getElementById(id);
  const form = $('form');

  function readCall() {
    return {
      mc: $('mc').value, age: $('age').value, email: $('email').value,
      phone: $('phone').value, ptype: $('ptype').value, bid: $('bid').value,
      transcript: $('transcript').value
    };
  }
  function isEmpty(c) { return !c.mc && !c.age && !c.email && !c.phone && !c.bid && !c.transcript.trim(); }

  function networkHits(c) {
    const hits = [];
    const p = digits(c.phone), e = normEmail(c.email), m = normMC(c.mc);
    if (p && state.block.phones.includes(p)) hits.push('phone ' + fmtPhone(p));
    if (e && state.block.emails.includes(e)) hits.push('email ' + e);
    if (m && state.block.mcs.includes(m)) hits.push('MC ' + m);
    return hits;
  }

  function features(c) {
    const age = c.age === '' ? NaN : Number(c.age);
    const bid = c.bid === '' ? NaN : Number(c.bid);
    const domain = normEmail(c.email).split('@')[1] || '';
    const t = c.transcript || '';
    return {
      newMC: Number.isFinite(age) && age < 90 ? 1 : 0,
      freeMail: FREE_DOMAINS.has(domain) ? 1 : 0,
      voip: c.ptype === 'voip' ? 1 : 0,
      lowBid: Number.isFinite(bid) && bid <= -15 ? 1 : 0,
      payment: RX.payment.test(t) ? 1 : 0,
      urgency: RX.urgency.test(t) ? 1 : 0,
      offPlat: RX.offPlat.test(t) ? 1 : 0,
      network: networkHits(c).length ? 1 : 0,
    };
  }

  function score(x) {
    let z = state.b;
    for (const s of SIGNALS) z += state.w[s.key] * x[s.key];
    return sigmoid(z);
  }

  // ---------- Render ----------
  let lastPct = null;
  let lastSignKey = '';

  function fmtPhone(d) {
    return d.length === 10 ? `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}` : d;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, ch => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[ch]));
  }
  function retrigger(el, cls) {
    el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls);
  }

  function renderVerdict() {
    const c = readCall();
    const sign = $('verdict'), list = $('reasons');
    let key;
    if (isEmpty(c)) {
      sign.className = 'sign';
      $('pct').textContent = '–'; $('call').textContent = 'Enter a call';
      $('sub').textContent = 'Pick a demo call or fill in the form';
      list.innerHTML = '<li class="none">Reasons show up here, strongest first.</li>';
      lastPct = null; key = 'empty';
    } else {
      const x = features(c);
      const p = score(x);
      const pct = Math.round(p * 100);
      const hold = p >= THRESHOLD;
      sign.className = 'sign ' + (hold ? 'hold' : 'safe');
      $('pct').textContent = pct + '%';
      $('call').textContent = hold ? 'Hold the load' : 'Safe to book';
      $('sub').textContent = 'Fraud risk. Loads are held at ' + Math.round(THRESHOLD * 100) + '% or more.';

      const active = SIGNALS.filter(s => x[s.key]).sort((a, b) => state.w[b.key] - state.w[a.key]);
      if (!active.length) {
        list.innerHTML = '<li class="none">No risk signals on this call.</li>';
      } else {
        const hits = networkHits(c);
        list.innerHTML = active.map(s => {
          const extra = s.key === 'network' ? ': ' + esc(hits.join(', ')) : '';
          return `<li class="${s.key === 'network' ? 'net' : ''}"><span>${esc(s.label)}${extra}</span><span class="w">+${state.w[s.key].toFixed(2)}</span></li>`;
        }).join('');
      }
      lastPct = pct; key = pct + (hold ? 'h' : 's');
    }
    if (key !== lastSignKey) { lastSignKey = key; retrigger(sign, 'flip'); }
  }

  function buildWeights() {
    $('weights').innerHTML = SIGNALS.map(s =>
      `<div class="wrow" data-k="${s.key}" title="${esc(s.label)}"><span>${esc(s.short)}</span><span class="track"><i class="fill"></i></span><span class="num"></span><span class="delta" aria-hidden="true"></span></div>`
    ).join('');
  }

  function renderWeights(deltas) {
    const maxW = Math.max(3.2, ...SIGNALS.map(s => state.w[s.key]));
    for (const s of SIGNALS) {
      const row = document.querySelector(`.wrow[data-k="${s.key}"]`);
      const w = state.w[s.key];
      row.querySelector('.fill').style.width = `calc(${Math.max(0, w) / maxW * 100}% - 12px)`;
      row.querySelector('.num').textContent = w.toFixed(2);
      const d = deltas && deltas[s.key];
      if (d) {
        const el = row.querySelector('.delta');
        el.textContent = (d > 0 ? '+' : '−') + Math.abs(d).toFixed(2);
        el.className = 'delta ' + (d > 0 ? 'up' : 'down');
        retrigger(row, 'changed');
      }
    }
    $('bias').textContent = `Base rate ${state.b.toFixed(2)}. Each confirmed call nudges these weights.`;
  }

  function renderMemory(deltas, newIds) {
    const b = state.block;
    const flagged = b.phones.length + b.emails.length + b.mcs.length;
    $('s-learned').textContent = state.learned;
    $('s-flagged').textContent = flagged;
    const recent = state.history.slice(-20);
    $('s-acc').textContent = recent.length
      ? Math.round(recent.filter(h => h.pred === h.label).length / recent.length * 100) + '%'
      : '–';
    const chips = [
      ...b.phones.map(p => ['phone ' + p, 'Phone ' + fmtPhone(p)]),
      ...b.emails.map(e => ['email ' + e, e]),
      ...b.mcs.map(m => ['mc ' + m, 'MC ' + m])
    ];
    $('chips').innerHTML = chips.length
      ? chips.map(([id, t]) => `<span class="chip${newIds && newIds.has(id) ? ' new' : ''}">${esc(t)}</span>`).join('')
      : '<span class="empty-chips">No flagged identifiers yet. Confirmed fraud lands here.</span>';

    renderWeights(deltas);

    const log = $('log');
    log.innerHTML = state.log.length
      ? state.log.slice().reverse().map(e =>
          `<li class="${e.kind}"><time>${esc(new Date(e.t).toLocaleTimeString())}</time>${esc(e.text)}</li>`).join('')
      : '<li class="none">Nothing yet. Confirm a call to teach the model.</li>';
  }

  function render() { renderVerdict(); renderMemory(); }

  // ---------- Learning ----------
  function confirm(label) {
    const c = readCall();
    if (isEmpty(c)) { toast('Fill in a call first.'); return; }
    const x = features(c);
    const p = score(x);
    const pred = p >= THRESHOLD ? 1 : 0;
    const err = label - p;               // gradient of log-loss w.r.t. logit
    const changes = [];
    const deltas = {};

    for (const s of SIGNALS) {
      if (!x[s.key]) continue;
      const before = state.w[s.key];
      const after = Math.round((before + LR * err) * 100) / 100;
      state.w[s.key] = after;
      if (after !== before) {
        deltas[s.key] = after - before;
        changes.push(`${s.short} ${before.toFixed(2)} to ${after.toFixed(2)}`);
      }
    }
    const bBefore = state.b;
    state.b = Math.round((state.b + LR * err * 0.5) * 100) / 100;

    const added = [];
    const newIds = new Set();
    if (label === 1) {
      const ph = digits(c.phone), em = normEmail(c.email), mc = normMC(c.mc);
      if (ph && !state.block.phones.includes(ph)) { state.block.phones.push(ph); added.push('phone ' + fmtPhone(ph)); newIds.add('phone ' + ph); }
      if (em && !state.block.emails.includes(em)) { state.block.emails.push(em); added.push('email ' + em); newIds.add('email ' + em); }
      if (mc && !state.block.mcs.includes(mc)) { state.block.mcs.push(mc); added.push('MC ' + mc); newIds.add('mc ' + mc); }
    }

    state.history.push({ pred, label });
    if (state.history.length > 200) state.history.shift();
    state.learned++;

    const pct = Math.round(p * 100);
    const right = pred === label;
    let text = `Confirmed ${label ? 'fraud' : 'legit'}. The model said ${pct}% and ${pred ? 'held the load' : 'cleared it'}, ${right ? 'which was right' : 'which was a miss'}. `;
    text += changes.length ? (label ? 'Trusting these signals more: ' : 'Trusting these signals less: ') + changes.join('; ') + '. ' : 'No risk signals to adjust. ';
    if (state.b !== bBefore) text += `Base rate ${bBefore.toFixed(2)} to ${state.b.toFixed(2)}. `;
    if (added.length) text += 'Added to the network blocklist: ' + added.join(', ') + '.';
    state.log.push({ t: Date.now(), kind: label ? 'f' : 'l', text: text.trim() });
    if (state.log.length > 50) state.log.shift();

    save();
    renderVerdict();
    renderMemory(deltas, newIds);
    toast(`Learned. This call now scores ${lastPct}% (was ${pct}%).`);
  }

  function reset() {
    if (!window.confirm('Reset all learned weights and the network blocklist?')) return;
    state = fresh();
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
    render();
    toast('Network memory reset.');
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
  }

  // ---------- Presets ----------
  const PRESETS = {
    legit: {
      mc: '784512', age: '2190', email: 'dispatch@ridgelinefreight.com', phone: '(614) 555-0142', ptype: 'landline', bid: '-3',
      transcript: "Hi, this is Dana with Ridgeline Freight. We can cover your Columbus to Atlanta load Thursday at the posted rate. Our insurance certificate is on file with you. Please send the rate confirmation to dispatch@ridgelinefreight.com."
    },
    scam: {
      mc: '1123987', age: '412', email: 'bluehaul.dispatch@gmail.com', phone: '(305) 555-0199', ptype: 'voip', bid: '-6',
      transcript: "Hey, Mike from Blue Haul Logistics. Got a truck near Dallas that fits your Houston load, rate works for us. I'm on the road most of the day, so can we move this over to WhatsApp? Easier to send the paperwork there."
    },
    repeat: {
      mc: '1189034', age: '21', email: 'ops@summitcarriersllc.com', phone: '305.555.0199', ptype: 'voip', bid: '-5',
      transcript: "This is Jake with Summit Carriers. We have a driver empty in Fort Worth and can take your Houston load. Send the rate confirmation to ops@summitcarriersllc.com."
    }
  };
  function applyPreset(name) {
    const p = PRESETS[name];
    if (!p) return;
    for (const k of Object.keys(p)) $(k).value = p[k];
    lastSignKey = '';
    renderVerdict();
    if (window.innerWidth < 880) $('verdict').scrollIntoView({ behavior: reduceMotion() ? 'auto' : 'smooth', block: 'start' });
  }

  // ---------- Wire up ----------
  document.querySelectorAll('[data-preset]').forEach(b => b.addEventListener('click', () => applyPreset(b.dataset.preset)));
  form.addEventListener('input', renderVerdict);
  form.addEventListener('change', renderVerdict);
  form.addEventListener('submit', e => e.preventDefault());
  $('btn-fraud').addEventListener('click', () => confirm(1));
  $('btn-legit').addEventListener('click', () => confirm(0));
  $('btn-reset').addEventListener('click', reset);

  buildWeights();
  render();
})();
</script>
</body>
</html>
